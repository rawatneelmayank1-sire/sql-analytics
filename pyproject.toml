[project]
name = "sql-analytics"
version = "1.0.0"
description = "Business questions answered in SQL on one year of pizza restaurant orders (DuckDB)."
authors = [{ name = "Neelmayank Rawat", email = "rawatneelmayank1@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1,<2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
