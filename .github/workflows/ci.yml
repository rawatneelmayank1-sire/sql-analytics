name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests on the hand-made fixture
        run: python -m pytest -q
      - name: Download the real data (Maven Analytics, public domain)
        run: python scripts/download_data.py
      - name: Every query on the real data
        run: PYTHONPATH=src python -m sql_analytics.run --no-charts --results /tmp/results
